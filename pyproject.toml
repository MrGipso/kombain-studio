[project]
name = "pipeline-studio"
version = "1.0.0rc2"
description = "Universal content production pipeline (transcription -> scenes -> shots -> stock/AI media -> export)."
requires-python = ">=3.12"  # supported and tested project baseline
license = "MIT"

# Web server (backend/) runtime dependencies.
# The supported application is headless and does not require Tk or Qt.
# External tools are NOT Python packages: whisper.cpp,
# ffmpeg, LM Studio and ComfyUI must be installed/run separately.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",  # required by FastAPI for file uploads (transcription audio)
    "pillow>=10.0",             # perceptual-hash dedup for the stock route (optional but recommended)
    "yt-dlp>=2025.6.30",        # subtitle-only YouTube intake for the Rewrite workflow
]

[project.optional-dependencies]
# Native LM Studio structured-output transport. The core client keeps an
# OpenAI-compatible HTTP fallback, so headless installs do not require it.
local-ai = ["lmstudio>=1.5,<2"]
# Native window around the web application (launch.py). Uses the system webview,
# so it needs no browser, no Node and no Qt.
desktop-app = ["pywebview>=5.0"]
# Reference-insert route (Wikipedia / arXiv screenshots). Optional: without it
# the route still works, falling back to a clean card rendered from the page's
# API summary (needs only Pillow, already a core dep). Install for real page
# screenshots, then run `playwright install chromium` once.
reference = ["playwright>=1.40"]
# Windows installer build (packaging/). Only CI and release builders need it.
bundle = ["pyinstaller>=6.11"]
# Development / testing.
dev = [
    "httpx2>=2.0.0",  # Starlette TestClient transport; avoids deprecated httpx fallback
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --basetemp=.pytest-tmp/pytest"
